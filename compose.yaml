services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: treechop-build
    # Use the host network stack directly. The Docker bridge mangled large
    # downloads from the Sponge/NeoForge snapshot repos (reads timed out while
    # the host downloaded fine); host networking sidesteps the bridge entirely.
    network_mode: host
    volumes:
      # Build the current working-tree source.
      - .:/workspace
      # Persist Gradle downloads/caches across builds (no host pollution).
      - treechop-gradle-cache:/gradle-home
      # Finished jars land here on the host.
      - ./build:/output
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        gradle --no-daemon build \
          -Dorg.gradle.internal.http.connectionTimeout=60000 \
          -Dorg.gradle.internal.http.socketTimeout=60000
        mkdir -p /output
        find neoforge/build/libs fabric/build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp -v {} /output/ \;
        # Hand the output and any Gradle-generated dirs back to the host user
        # (owner of the mounted workspace) so they aren't left root-owned and
        # undeletable, and so the devcontainer (non-root) can use them. The
        # owner is read inline via $(...) because a shell variable like $owner
        # would be eaten by Docker Compose's own $-interpolation.
        chown -R "$(stat -c '%u:%g' /workspace)" /output /workspace/.gradle /workspace/*/build 2>/dev/null || true

volumes:
  treechop-gradle-cache:
