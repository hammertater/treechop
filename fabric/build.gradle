plugins {
    id "fabric-loom"
}

version = mod_version
group = mod_group

base {
    archivesName = "$mod_name-$minecraft_version-$project.name"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : "$mod_id-$project.name",
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.parchmentmc.org" }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_mappings_version@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    implementation project(":shared")
    implementation project(":tuber")

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$forgeconfigapiport_version"
    modApi "com.terraformersmc:modmenu:13.0.4"

    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-14.6.2"
    modRuntimeOnly "mcp.mobius.waila:wthit:fabric-14.6.2"
    modRuntimeOnly "lol.bai:badpackets:fabric-0.8.2"

    modCompileOnly "curse.maven:jade-324717:6155088"
//    modRuntimeOnly "curse.maven:jade-324717:6155088"

//    modRuntimeOnly "maven.modrinth:sodium:mc1.19.3-0.4.9" // Doesn't wanna work in IntelliJ
//    modRuntimeOnly "curse.maven:indium-459496:3957480"
//    modRuntimeOnly "curse.maven:irisshaders-455508:3981799"

//    modRuntimeOnly "curse.maven:carry-on-274259:6449642"

//    modRuntimeOnly "curse.maven:terrablender-565956:6055020"

    modCompileOnly "com.terraformersmc.terraform-api:terraform-wood-api-v1:13.0.0"

}

processResources {
    from project(":shared").sourceSets.main.resources
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.mixins.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":shared").sourceSets.main.java)
    source(project(":tuber").sourceSets.main.java)
}
